name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt && pip install pytest
      - name: Compile check
        run: python -m compileall -q backend/app backend/tests
      - name: Run tests
        run: python -m pytest backend/tests -q

  docker-build:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t telur-branch-management:ci .
